name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify NVD API key is configured
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Set the NVD_API_KEY repository secret to run the OWASP dependency scan."
            exit 1
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Run backend tests and OWASP dependency scan
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
