spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/marketplace-realm
          jwk-set-uri: http://localhost:8080/realms/marketplace-realm/protocol/openid-connect/certs

logging:
  level:
    root: INFO
    com.marketplace: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket-name: ${S3_PRIVATE_BUCKET}

payment:
  operations:
    enabled: ${PAYMENT_OPERATIONS_ENABLED}
    production-approved: ${PAYMENT_PRODUCTION_APPROVED}
    sandbox-only: ${PAYMENT_SANDBOX_ONLY}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    api-base-url: ${RAZORPAY_API_BASE_URL}

security:
  otp:
    secret: ${OTP_SECRET}
