server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: marketplace-backend
  profiles:
    default: dev
  # Local secrets live in backend/.env (KEY=VALUE). Spring does not read .env files on its own,
  # so import it as a properties file. Both paths cover running from backend/ or the repo root.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
