server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: marketplace-backend
  profiles:
    default: dev
  # Local secrets live in backend/.env (KEY=VALUE). Spring does not read .env files on its own,
  # so import it as a properties file. Both paths cover running from backend/ or the repo root.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Emails are sent after commit on the request thread; keep a dead SMTP server from stalling requests.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Thymeleaf renders email templates only; no server-side web views.
  thymeleaf:
    check-template-location: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Service account used to grant ROLE_OWNER when an admin approves an owner's KYC.
# With no client secret, approval still succeeds and the admin is told to assign the role by hand.
keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Draft cancellation policy (docs/requirements/unresolved-business-decisions.md, Decision 6).
# Pending legal review: these values are not approved for production enforcement.
cancellation:
  full-refund-hours: 48                       # >= 48 h before start: rental charges refunded less the gateway fee
  partial-refund-hours: 24                    # 24-48 h: partial-refund-percent of rental charges
  partial-refund-percent: 50
  gateway-fee-percent: 2                      # of rental charges, full-refund tier only
  partial-owner-compensation-percent: 0       # not specified by the draft policy
  late-owner-compensation-percent: 80         # < 24 h: owner gets this share of the expected payout
  owner-cancellation-platform-credit: 500.00  # recorded only; no credit ledger yet

# Transactional email. Off unless a profile turns it on (dev: NOTIFICATIONS_ENABLED=true with Mailpit).
notifications:
  enabled: false
  from: noreply@marketplace.local
  app-base-url: http://localhost:4200     # frontend URL used in email links

# Days after COMPLETED during which renter and owner may review; then the booking is CLOSED.
reviews:
  window-days: 14

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
