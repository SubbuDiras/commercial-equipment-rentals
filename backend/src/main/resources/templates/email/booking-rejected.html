<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2937; line-height: 1.5; max-width: 600px;">
<p th:text="|Hi ${recipient.name()},|">Hi there,</p>
<p>Unfortunately the owner declined your booking request.</p>
<div th:replace="~{email/fragments :: booking}"></div>
<p th:if="${reason}">Reason: <em th:text="${reason}">reason</em></p>
<p>The dates have been released. You can search for other equipment.</p>
<p><a th:href="${appUrl}" href="#">Browse equipment</a></p>
<div th:replace="~{email/fragments :: footer}"></div>
</body>
</html>
